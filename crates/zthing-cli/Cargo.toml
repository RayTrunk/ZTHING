[package]
name = "zthing-cli"
description = "Command-line search for ZTHING"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde_json = "1.0.154"
zthing-core = { version = "0.1.0", path = "../zthing-core" }
zthing-ntfs = { version = "0.1.0", path = "../zthing-ntfs" }

[lints]
workspace = true
