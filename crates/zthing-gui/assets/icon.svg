<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dunkler Hintergrund-Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222733" />
      <stop offset="100%" stop-color="#12151C" />
    </linearGradient>

    <!-- Innerer Linsen-Schatten -->
    <radialGradient id="lens-grad" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#151821" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B0D12" stop-opacity="0.95" />
    </radialGradient>

    <!-- Rust-Orange zu Cyan Verlauf -->
    <linearGradient id="accent-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="45%" stop-color="#F7931E" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Leucht-Effekt für Ring und Z -->
    <filter id="neon-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App-Kachel (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#333B4D" stroke-width="6" />
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />

  <!-- Lupen-Hintergrundglas -->
  <circle cx="236" cy="236" r="128" fill="url(#lens-grad)" />

  <!-- Lupenring -->
  <circle cx="236" cy="236" r="128" fill="none" stroke="url(#accent-grad)" stroke-width="22" filter="url(#neon-glow)" />

  <!-- Lupengriff -->
  <line x1="330" y1="330" x2="398" y2="398" stroke="url(#accent-grad)" stroke-width="38" stroke-linecap="round" />

  <!-- Z-Symbol in der Mitte -->
  <path d="M 182 178 L 294 178 L 294 206 L 222 266 L 294 266 L 294 294 L 178 294 L 178 266 L 250 206 L 182 206 Z" 
        fill="url(#accent-grad)" 
        filter="url(#neon-glow)" />
</svg>