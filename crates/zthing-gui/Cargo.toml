[package]
name = "zthing-gui"
description = "Search window for ZTHING"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zthing-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.32.3"
egui_extras = "0.32.3"
global-hotkey = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
# HTTP API: a small synchronous server, no async runtime for two GET endpoints.
tiny_http = "0.12.0"
toml = "1.2.1"
tray-icon = "0.24.2"
winsafe = { version = "0.0.24", features = ["kernel", "user"] }
zthing-client = { version = "0.1.0", path = "../zthing-client" }

[lints]
workspace = true

[build-dependencies]
embed-manifest = "1.5.1"
resvg = "0.50.0"
