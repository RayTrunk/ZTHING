[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zthing"
version = "0.88.0"
description = "Search file names through the ZTHING service on Windows"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.8"
classifiers = ["Operating System :: Microsoft :: Windows"]
